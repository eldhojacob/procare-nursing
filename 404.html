<!DOCTYPE html>
<html lang="en-AU" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Procare Nursing</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0F766E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1716" media="(prefers-color-scheme: dark)" />

    <!-- No-flash theme: set the dark class BEFORE first paint. -->
    <script>
      (function () {
        try {
          document.documentElement.classList.remove('no-js');
          var saved = localStorage.getItem('procare-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preload" href="./assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./assets/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./dist/styles.css" />
    <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
  </head>

  <body
    class="flex min-h-screen flex-col bg-sand-50 font-sans text-base text-ink-900 antialiased dark:bg-night-900 dark:text-cloud-50"
  >
    <!-- ============================ HEADER ============================ -->
    <header
      class="sticky top-0 z-40 border-b border-sand-200/70 bg-sand-50/85 backdrop-blur dark:border-night-800/70 dark:bg-night-900/85"
    >
      <div class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-5 py-3 sm:px-6">
        <a href="./index.html" class="flex items-center gap-2.5" aria-label="Procare Nursing home">
          <span
            class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-teal-600 text-white max-[359px]:hidden dark:bg-teal-300 dark:text-night-900"
            aria-hidden="true"
          >
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7-4.35-9.5-8.5C1 9 2.5 5.5 6 5.5c2 0 3 1.2 3.5 2 .5-.8 1.5-2 3.5-2 3.5 0 5 3.5 3.5 7C19 16.65 12 21 12 21z" />
            </svg>
          </span>
          <span class="font-display text-base font-semibold leading-tight tracking-tight sm:text-xl">Procare Nursing</span>
        </a>

        <nav class="flex items-center gap-2 sm:gap-3" aria-label="Primary">
          <a
            data-config="contact.phoneHref"
            data-config-attr="tel-href"
            href="tel:+61414013602"
            class="btn-primary whitespace-nowrap px-3 py-2 text-sm sm:px-5"
          >
            <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z" />
            </svg>
            <span class="sr-only">Call</span>
            <span data-config="contact.phone">0414 013 602</span>
          </a>

          <button
            id="theme-toggle"
            type="button"
            class="grid h-10 w-10 place-items-center rounded-full border border-sand-200 bg-sand-50 text-ink-900 transition hover:bg-sand-100 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-teal-600/40 dark:border-night-800 dark:bg-night-800 dark:text-cloud-50"
            aria-label="Switch between light and dark theme"
            aria-pressed="false"
          >
            <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
            <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </nav>
      </div>
    </header>

    <!-- ============================= MAIN ============================= -->
    <main id="main" class="flex flex-1 items-center">
      <div class="mx-auto w-full max-w-xl px-5 py-20 text-center sm:px-6">
        <p class="font-display text-6xl font-semibold text-teal-700 dark:text-teal-300">404</p>
        <h1 class="mt-4">
          We couldn't find that page
        </h1>
        <p class="mt-4 text-lg text-ink-700 dark:text-cloud-200">
          The page may have moved. Let's get you back to care.
        </p>
        <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
          <a href="./index.html" class="btn-primary">Back to home</a>
          <a
            data-config="contact.phoneHref"
            data-config-attr="tel-href"
            href="tel:+61414013602"
            class="btn-secondary"
          >
            Call our nursing team
          </a>
        </div>
        <p class="mt-6 text-sm text-ink-700 dark:text-cloud-200">
          For a medical emergency, call <a href="tel:000" class="font-semibold underline">000</a>.
        </p>
      </div>
    </main>

    <!-- ============================ FOOTER ============================ -->
    <footer class="border-t border-sand-200 bg-sand-100/60 dark:border-night-800 dark:bg-night-800/40">
      <div class="mx-auto max-w-6xl px-5 py-6 text-xs text-ink-700 dark:text-cloud-200 sm:px-6">
        <p>&copy; <span id="footer-year">2026</span> <span data-config="business.legalName">Procare Nursing Pty Ltd</span>. All rights reserved.</p>
      </div>
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
